<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川润智造系统平台</title>
    <link rel="stylesheet" href="/static/libs/element-plus.css">
    <script src="/static/libs/vue.min.js"></script>
    <script src="/static/libs/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --grad-brand: linear-gradient(135deg, #1a2a3a 0%, #1e3f6f 45%, #2d6fb5 100%);
            --c-surface: rgba(255,255,255,.96);
            --c-text: #1f2329;
            --c-text-2: #606266;
            --c-text-3: #8b939e;
            --radius: 16px;
            --shadow-card: 0 8px 32px rgba(0,0,0,.25);
            --shadow-hover: 0 16px 48px rgba(0,0,0,.35);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }
        body { font-family: var(--font); background: var(--grad-brand); min-height: 100vh; color: var(--c-text); }
        /* 顶部导航 */
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; }
        .brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
        .brand-icon { width: 36px; height: 36px; background: rgba(255,255,255,.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .brand-icon svg { width: 20px; height: 20px; color: #fff; }
        .brand-name { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
        .brand-en { font-size: 11px; color: rgba(255,255,255,.5); letter-spacing: 1px; }
        .top-actions { display: flex; align-items: center; gap: 12px; }
        /* 主体 */
        .hero { text-align: center; padding: 48px 48px 20px; color: #fff; }
        .hero-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: 1px; }
        .hero-sub { font-size: 15px; color: rgba(255,255,255,.6); letter-spacing: .5px; }
        .hero-divider { width: 48px; height: 3px; background: rgba(255,255,255,.4); border-radius: 2px; margin: 20px auto 0; }
        /* 卡片区 */
        .cards-area { max-width: 1100px; margin: 0 auto; padding: 40px 48px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .sys-card { background: var(--c-surface); border-radius: var(--radius); padding: 32px 28px 28px; cursor: pointer; transition: all .3s cubic-bezier(.22,.61,.36,1); box-shadow: var(--shadow-card); position: relative; overflow: hidden; text-decoration: none; color: var(--c-text); display: block; }
        .sys-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: var(--radius) var(--radius) 0 0; }
        .sys-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
        .sys-card:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        .card-accent { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .card-accent svg { width: 26px; height: 26px; color: #fff; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--c-text); }
        .card-desc { font-size: 13px; color: var(--c-text-2); line-height: 1.6; margin-bottom: 20px; min-height: 40px; }
        .card-meta { display: flex; align-items: center; justify-content: space-between; }
        .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #f0f2f5; color: var(--c-text-3); }
        .card-enter { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px; transition: all .2s; color: #fff; }
        .card-enter svg { width: 14px; height: 14px; }
        .card-enter:hover { opacity: .85; }
        /* 各系统颜色 */
        .card-tooling::before { background: #409eff; }
        .card-tooling .card-accent { background: #409eff; }
        .card-tooling .card-enter { background: #409eff; }
        .card-tooling .card-tag { background: #ecf5ff; color: #409eff; }

        .card-process::before { background: #67c23a; }
        .card-process .card-accent { background: #67c23a; }
        .card-process .card-enter { background: #67c23a; }
        .card-process .card-tag { background: #f0f9eb; color: #67c23a; }

        .card-cost::before { background: #e6a23c; }
        .card-cost .card-accent { background: #e6a23c; }
        .card-cost .card-enter { background: #e6a23c; }
        .card-cost .card-tag { background: #fdf6ec; color: #e6a23c; }

        /* 底部 */
        .footer { text-align: center; padding: 20px 48px 32px; font-size: 12px; color: rgba(255,255,255,.35); letter-spacing: .3px; }

        /* 加载状态 */
        .loading-wrap { display: flex; justify-content: center; align-items: center; height: 60vh; }
        @media (max-width: 768px) {
            .top-bar { padding: 16px 20px; }
            .hero { padding: 32px 20px 16px; }
            .hero-title { font-size: 24px; }
            .cards-area { padding: 24px 20px 40px; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 顶部 -->
    <div class="top-bar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <div>
                <div class="brand-name">川润智造系统平台</div>
                <div class="brand-en">CHUANGRUN MANUFACTURING PORTAL</div>
            </div>
        </div>
        <div class="top-actions">
            <span style="color:rgba(255,255,255,.5);font-size:13px;">{{ currentTime }}</span>
        </div>
    </div>

    <!-- 主体 -->
    <div class="hero">
        <div class="hero-title">欢迎使用川润智造系统平台</div>
        <div class="hero-sub">点击下方卡片进入对应系统</div>
        <div class="hero-divider"></div>
    </div>

    <!-- 系统卡片 -->
    <div class="cards-area">
        <!-- 工装管理系统 -->
        <a class="sys-card card-tooling" href="/tooling">
            <div class="card-accent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
            <div class="card-title">工装管理系统</div>
            <div class="card-desc">工装台账管理、入库、借用、归还、检定全流程数字化管控</div>
            <div class="card-meta">
                <div class="card-tags">
                    <span class="card-tag">台账管理</span>
                    <span class="card-tag">借用流程</span>
                    <span class="card-tag">定期检定</span>
                </div>
                <div class="card-enter">
                    进入
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </div>
            </div>
        </a>

        <!-- 工艺开发系统 -->
        <a class="sys-card card-process" href="/process">
            <div class="card-accent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
            </div>
            <div class="card-title">工艺开发系统</div>
            <div class="card-desc">工艺流程图、PFMEA、关键特性、设计评审等全流程开发管理</div>
            <div class="card-meta">
                <div class="card-tags">
                    <span class="card-tag">流程图</span>
                    <span class="card-tag">PFMEA</span>
                    <span class="card-tag">设计评审</span>
                </div>
                <div class="card-enter">
                    进入
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </div>
            </div>
        </a>

        <!-- 成本估算系统 -->
        <a class="sys-card card-cost" href="/cost">
            <div class="card-accent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <div class="card-title">成本估算系统</div>
            <div class="card-desc">BOM材料成本、设备费率、人工费用多维度精准估算</div>
            <div class="card-meta">
                <div class="card-tags">
                    <span class="card-tag">BOM分析</span>
                    <span class="card-tag">费率配置</span>
                    <span class="card-tag">成本报表</span>
                </div>
                <div class="card-enter">
                    进入
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </div>
            </div>
        </a>
    </div>

    <!-- 底部 -->
    <div class="footer">
        © 2026 四川川润液压技术有限公司 · 智改数转项目
    </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const currentTime = ref('');
        const updateTime = () => {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            currentTime.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        };
        onMounted(() => {
            updateTime();
            setInterval(updateTime, 60000);
        });
        return { currentTime };
    }
}).mount('#app');
</script>
</body>
</html>
